services:
  sla-modern-pro:
    build:
      context: .
      dockerfile: Dockerfile
    image: sla-modern-pro:local
    container_name: sla-modern-pro
    restart: unless-stopped
    ports:
      # Publicado só em localhost do WSL: acessível em http://localhost:8000
      # a partir do Windows (via port-forwarding automático do WSL2), mas
      # não visível para outras máquinas da LAN. A aplicação não tem login
      # próprio, então NÃO troque para "8000:8000" (bind em todas as
      # interfaces) sem colocar um reverse proxy com TLS/autenticação e/ou
      # VPN/firewall na frente.
      - "127.0.0.1:8000:8000"
    env_file:
      # Configuração local (URL padrão, servidores Zabbix permitidos...). Veja .env.example.
      - path: .env
        required: false
    environment:
      # Ajusta os horários padrão do relatório (mês atual) e os timestamps
      # exibidos para o fuso local; containers Linux usam UTC por padrão.
      - TZ=America/Sao_Paulo
    read_only: true
    tmpfs:
      # REPORT_DIR (tempfile.gettempdir()) grava os CSVs aqui; tmpfs limita
      # o tamanho e limpa tudo automaticamente a cada restart do container.
      - /tmp:size=200m,uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: "1.0"
    # Ajustes de uma máquina só (ex.: rede de um Zabbix local) vão em
    # docker-compose.override.yml, que fica fora do git.
